name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro and TypeScript check
        run: npm run check

      - name: Build production site
        run: npm run build
        env:
          SITE_URL: https://penghou.pages.dev
